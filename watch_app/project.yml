# Projet XcodeGen, généré par la CI (.github/workflows/watch_app*.yml) : aucun Mac.
# Une app « montre seule » doit être emballée dans une coquille iOS vide
# (watchapp2-container) : une archive watchOS nue n'est pas envoyable sur
# App Store Connect/TestFlight (bug Xcode 15→26, forums Apple 738218/817223).
name: LolRemote
options:
  deploymentTarget:
    iOS: "17.0"
    watchOS: "10.0"
settings:
  base:
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"   # remplacé par le n° de run de la CI TestFlight
    SWIFT_VERSION: "5.0"
schemes:
  # Xcode ne crée pas de schéma automatique pour une coquille : déclaré ici.
  LolRemote:
    build:
      targets:
        LolRemote: all
    archive:
      config: Release
  LolRemoteWatch:
    build:
      targets:
        LolRemoteWatch: all
targets:
  # Coquille iOS (sans code) : c'est elle qu'on archive et qu'App Store Connect voit.
  LolRemote:
    type: application.watchapp2-container
    platform: iOS
    sources: [Container]   # icône seulement (affichée par TestFlight)
    info:
      path: build/Container-Info.plist
      properties:
        CFBundleDisplayName: LolRemote
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        ITSAppUsesNonExemptEncryption: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: fr.maxime.lolremote
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
      configs:
        Release:
          CODE_SIGN_STYLE: Manual
          CODE_SIGN_IDENTITY: Apple Distribution
          PROVISIONING_PROFILE_SPECIFIER: LolRemote App Store
    dependencies:
      - target: LolRemoteWatch
        embed: true
        copy:
          destination: productsDirectory
          subpath: $(CONTENTS_FOLDER_PATH)/Watch
  # La vraie app (montre seule, sans app iPhone).
  LolRemoteWatch:
    type: application
    platform: watchOS
    sources: [LolRemote, Shared]
    info:
      path: build/Info.plist
      properties:
        CFBundleDisplayName: LolRemote
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        WKApplication: true
        WKWatchOnly: true
        ITSAppUsesNonExemptEncryption: false
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
        NSLocalNetworkUsageDescription: Connexion au Pi
        NSLocationWhenInUseUsageDescription: Trajet le plus court pour rentrer chez toi
        CFBundleURLTypes:   # lolremote://trip = appui sur la complication
          - CFBundleURLName: fr.maxime.lolremote.watchkitapp
            CFBundleURLSchemes: [lolremote]
        # Session longue (GameSession.swift) : vibrer à nos kills poignet baissé.
        WKBackgroundModes: [physical-therapy]
    entitlements:
      path: build/LolRemote.entitlements
      properties:
        aps-environment: production   # notifications push (builds TestFlight)
        # Domicile partagé avec la complication (groupe créé à la main, cf. README).
        com.apple.security.application-groups: [group.fr.maxime.lolremote]
    settings:
      base:
        PRODUCT_NAME: LolRemote
        PRODUCT_BUNDLE_IDENTIFIER: fr.maxime.lolremote.watchkitapp
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        SKIP_INSTALL: true
      configs:
        Release:
          CODE_SIGN_STYLE: Manual
          CODE_SIGN_IDENTITY: Apple Distribution
          PROVISIONING_PROFILE_SPECIFIER: LolRemote Watch App Store
    dependencies:
      - target: LolRemoteTrains   # complication, embarquée dans PlugIns/
  # Complication / widget « Prochain train » (WidgetKit) : trains (Pi) ou trajet retour (IDFM).
  LolRemoteTrains:
    type: app-extension
    platform: watchOS
    sources: [Trains, Shared, LolRemote/Secrets.swift]
    info:
      path: build/Trains-Info.plist
      properties:
        CFBundleDisplayName: Prochain train
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
        NSLocalNetworkUsageDescription: Horaires des trains lus sur le Pi
        NSLocationWhenInUseUsageDescription: Trajet le plus court pour rentrer chez toi
        NSWidgetWantsLocation: true   # hors de chez soi : trajet retour
    entitlements:
      path: build/Trains.entitlements
      properties:
        com.apple.security.application-groups: [group.fr.maxime.lolremote]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: fr.maxime.lolremote.watchkitapp.trains
        SKIP_INSTALL: true
      configs:
        Release:
          CODE_SIGN_STYLE: Manual
          CODE_SIGN_IDENTITY: Apple Distribution
          PROVISIONING_PROFILE_SPECIFIER: LolRemote Trains App Store
