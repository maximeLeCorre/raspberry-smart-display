# Configuration de l'agent PC.
# Pour viser le vrai Pi : remplacer host par l'IP du Pi sur ton réseau local.

[pi]
host = "192.168.1.52"   # en test local : le Pi-display tourne sur la même machine
port = 8765
# TLS : doit correspondre au réglage du Pi (pi_display/config.toml [network].tls).
# true = connexion wss:// en épinglant le certificat du Pi (cert_file = le .crt
# copié depuis le Pi). false = ws:// en clair. Chemin relatif à la racine du dépôt.
tls = false
cert_file = "certs/pi-display.crt"

[agent]
# Intervalle entre deux mises à jour envoyées au Pi (secondes).
# Le cahier des charges demande 1 à 2 s max.
update_interval = 1.0

[lol]
# Noms des processus à surveiller (Windows).
client_process = "LeagueClientUx.exe"
game_process = "League of Legends.exe"

# Lancement du client si fermé (bouton unique « Jouer » du Pi). On passe par le
# Riot Client : il sait où League est installé (même sur un autre disque). Chaîne
# TOML littérale (guillemets simples) pour garder les antislash Windows.
launch_exe = 'C:\Riot Games\Riot Client\RiotClientServices.exe'
launch_args = ["--launch-product=league_of_legends", "--launch-patchline=live"]

# NB : l'enrichissement Web (dossiers joueurs, historique, bilan de fin) et la
# clé RIOT_API_KEY vivent désormais **sur le Pi** (pi_display/config.toml [riot]
# + [lol], et le .env du Pi). L'agent ne fait plus que du local (LCU + Live
# Client Data) et n'a besoin d'aucune clé.
