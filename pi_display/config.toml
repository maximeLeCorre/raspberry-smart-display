# Configuration de l'appli d'affichage.
# Pour passer du test local au vrai Pi : il suffit souvent de lancer avec
# --fullscreen (ou de laisser la détection auto du Pi faire le travail).

[network]
# Adresse d'écoute du serveur WebSocket.
# "0.0.0.0" = écoute sur toutes les interfaces (indispensable sur le Pi pour
# recevoir les messages du PC). En test local pur, "127.0.0.1" suffit aussi.
host = "0.0.0.0"
port = 8765
# TLS : chiffre le lien (wss://) et authentifie le Pi via un certificat
# auto-signé épinglé par l'agent. false = ws:// en clair (pratique en test
# local). Doit valoir la MÊME chose côté agent (pc_agent/config.toml [pi].tls).
# Générer le certificat une fois : `python pi_display/tools/gen_cert.py`.
# Le jeton d'auth (.env) reste utile EN PLUS de TLS (il authentifie le client).
tls = false
cert_file = "certs/pi-display.crt"   # chemins relatifs à la racine du dépôt
key_file = "certs/pi-display.key"    # (clé privée, reste sur le Pi)

[display]
width = 800        # résolution interne de rendu (ne pas changer : écran 5")
height = 480
fps = 15           # FPS max de la boucle d'affichage (Pi 3 = peu puissant)

[rss]
# Flux d'actualité affiché sur l'accueil (3 derniers titres) et l'écran France
# Info (liste complète). Le Pi récupère le flux lui-même. url = "" pour désactiver.
url = "https://www.francetvinfo.fr/titres.rss"
refresh_minutes = 15     # fréquence de rafraîchissement du flux
max_items = 15           # nombre d'articles gardés (liste France Info)

[weather]
# Météo sous l'horloge de l'accueil. Le Pi interroge Open-Meteo lui-même
# (gratuit, sans clé ; marche PC éteint). enabled = false pour masquer.
enabled = true
city = "Chaville"        # nom affiché
latitude = 48.8086
longitude = 2.1886
refresh_minutes = 15

[pi_health]
# Alerte sur l'accueil (ligne d'état) quand le Pi LUI-MÊME dépasse un seuil.
# Relevé local (/proc, /sys) ; rien ne s'affiche tant que tout va bien.
enabled = true
cpu_pct = 90       # CPU % (doit tenir cpu_sustain relevés de suite : pas d'alerte sur un pic)
cpu_sustain = 3
ram_pct = 90       # RAM utilisée %
disk_pct = 90      # carte SD remplie % (disk_path)
temp_c = 75        # °C (le Pi 3 bride vers 80 °C)
disk_path = "/"
poll_seconds = 5

[modules]
# Modules activés (source de vérité unique : le Pi l'annonce à l'agent).
# Le module système (horloge/date) est toujours actif.
league = true      # League of Legends (file, sélection, partie, après-partie)
server = true      # supervision + contrôle d'un petit serveur (SSH) — cf. [server]
transit = true     # prochains trains d'une gare + info trafic (API PRIM IDFM) — cf. [transit]
# valorant = false  # (exemple futur)

[riot]
# Routing de l'API Web Riot (le Pi l'interroge lui-même : historique, rangs...).
# La clé RIOT_API_KEY se met dans le .env du Pi (jamais ici, jamais sur Git).
platform = "euw1"     # plateforme : euw1, eun1, na1, kr, br1, ...
regional = "europe"   # région : europe, americas, asia

[lol]
# Ton Riot ID "Nom#TAG" : indispensable pour l'historique (le Pi tire les
# parties de CE compte). Vide = historique désactivé.
summoner = "maxoulefou#EUW"   # compte dont on tire l'historique
# Amis (premade) mis en évidence en ROSE sur l'écran de fin. "Nom#TAG"
# (insensible à la casse). Ajoute d'autres potes réguliers ici.
friends = ["Matte mwa#EUW"]
# Ami comparé sur l'écran STATS (Historique → STATS) : toi seul / lui seul /
# vous deux dans la même équipe. Riot ID "Nom#TAG" ; doit être dans tes amis LoL
# (l'agent lit ses 20 dernières parties via la LCU). Vide = écran sans ami.
compare = "Matte mwa#EUW"
# Scan automatique de l'historique (minutes) : le Pi demande à l'agent les
# nouvelles parties à ce rythme (en plus de l'ouverture de l'historique et de
# la connexion). Insensible au délai d'indexation LCU. 0 = scan périodique off.
sync_minutes = 3
# Bouton unique « Jouer une ARAM Chaos » (écran par défaut, agent connecté) :
# lance le client au besoin, crée le lobby puis invite. File créée : 2400 =
# ARAM du chaos. `lobby_invite` = un ami (Riot ID "Nom#TAG" ou juste "Nom")
# invité s'il est en ligne ; vide = aucune invitation. La LCU ne cherche plus
# par nom -> l'invité doit être dans tes amis.
lobby_queue = 2400
lobby_invite = "Matte mwa"

[server]
# Écran « Serveur » : le Pi se connecte LUI-MÊME en SSH (clé) pour relever les
# métriques (CPU/RAM/disque) et piloter des services. Marche PC éteint.
# L'IP du serveur se met dans le .env (SERVER_HOST=…, hors Git, copié par deploy) ;
# `host` ici ne sert que de repli. Aucun des deux => écran « non configuré ».
host = ""
port = 22
user = "opc"               # utilisateur SSH (celui autorisé par la clé publique)
key_file = "certs/server_id_ed25519"       # clé PRIVÉE sur le Pi (gitignorée, copiée par deploy)
known_hosts = "certs/server_known_hosts"   # empreinte du serveur, épinglée au 1er contact
disk_path = "/"           # partition suivie pour la jauge disque
poll_seconds = 5          # fréquence du relevé des métriques
history_minutes = 10      # fenêtre des courbes CPU/RAM (en mémoire, 1 point par relevé)

# Sauvegarde quotidienne des bases du Pi (historique LoL matches.db + weather.db)
# sur ce serveur, par SFTP : copie cohérente, une fois par jour à partir de `hour`
# (rattrapée au démarrage si le Pi était éteint). Fichiers <dir>/matches-AAAA-MM-JJ.db,
# `dir` relatif au home de `user` ; seules les `keep_days` plus récentes sont gardées.
[server.backup]
enabled = true
hour = 4
dir = "pi-display-backups"
keep_days = 14

# Services pilotables (start/stop/restart). Un seul pour l'instant (Minecraft).
# use_sudo=true => le serveur doit autoriser `sudo systemctl ...` sans mot de
# passe pour l'utilisateur SSH (règle sudoers NOPASSWD limitée à systemctl).
[[server.services]]
label = "Minecraft"
unit = "minecraft.service"
use_sudo = true

[transit]
# Écran « Trains » : le Pi interroge lui-même l'API PRIM d'Île-de-France Mobilités.
# Clé gratuite (prim.iledefrance-mobilites.fr) dans le .env : IDFM_API_KEY=… (hors Git).
# Identifiants : open data IDFM (jeux « zones-d-arrets » et « referentiel-des-lignes »).
station = "Chaville Rive Droite"
stop_area = "43241"          # zone d'arrêt (ZdA) ferrée de la gare
# Destinations rangées dans la 1re colonne (« vers Paris »), insensible à la casse.
# La L va à Saint-Lazare, la U à La Défense (même quai, voie 2).
paris_destinations = ["saint-lazare", "la défense"]
direction_labels = ["Vers Paris · La Défense", "Vers Versailles · La Verrière"]
tile_labels = ["Paris", "Versailles"]   # libellés courts de la tuile d'accueil
# À droite de l'horloge : temps avant l'ENTRÉE EN GARE du prochain train vers…
home_destination = "saint-lazare"   # (sous-chaîne de la destination, insensible à la casse)
home_label = "St-Lazare"
home_line = "L"
# ⚠️ Quota PRIM : 1 000 requêtes/jour par endpoint (remis à zéro à minuit UTC).
# Le rythme des départs s'adapte au quota restant (≈ 1 relevé / 90 s) ;
# refresh_seconds n'est que le plancher. La nuit, un relevé toutes les N minutes.
refresh_seconds = 60         # prochains passages : intervalle minimal
night_hours = [1, 5]         # [début, fin[ en heures locales
night_refresh_minutes = 15
messages_minutes = 5         # info trafic (une requête par ligne : 2 × 288 = 576/j)

[transit.lines]
# Lignes de la gare : id IDFM = lettre affichée (info trafic suivie pour chacune).
C01740 = "L"   # Paris Saint-Lazare <-> Versailles Rive Droite
C01741 = "U"   # La Défense <-> La Verrière

[gpio]
# Broches BCM des boutons physiques (uniquement sur le Pi, ignorées sur PC).
# button_back : force le retour au mode par défaut (même si le jeu tourne).
# button_next : passe au mode suivant.
button_back = 17
button_next = 27
