# Vérifie que l'app Apple Watch compile (simulateur, sans signature) et que son
# archive est bien une « iOS App Archive » (coquille + montre), seule forme
# envoyable sur TestFlight. Le code est écrit sous Windows : aucun Mac.
name: watch_app

on:
  push:
    paths: ["watch_app/**", ".github/workflows/watch_app*.yml"]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: XcodeGen
        run: brew install xcodegen
      - name: Génération du projet
        working-directory: watch_app
        run: xcodegen generate && xcodebuild -version && xcodebuild -list
      - name: Compilation (simulateur watchOS)
        working-directory: watch_app
        run: |
          set -o pipefail
          xcodebuild -project LolRemote.xcodeproj -scheme LolRemoteWatch \
            -destination 'generic/platform=watchOS Simulator' \
            CODE_SIGNING_ALLOWED=NO build | tail -n 60
      - name: Archive non signée (structure TestFlight)
        working-directory: watch_app
        run: |
          # Erreurs remontées en annotations (lisibles sans se connecter à GitHub).
          archive() {
            xcodebuild -project LolRemote.xcodeproj -scheme LolRemote \
              -destination "$1" -archivePath build/LolRemote.xcarchive \
              CODE_SIGNING_ALLOWED=NO archive > build/archive.log 2>&1 && return 0
            grep -E "error:|warning: .*(Watch|embed|container)" build/archive.log | sort -u | head -n 15 \
              | while IFS= read -r line; do echo "::error title=archive $1::$line"; done
            tail -n 30 build/archive.log
            return 1
          }
          mkdir -p build
          archive 'generic/platform=iOS'   # destination de la coquille ; la montre suit
          plutil -p build/LolRemote.xcarchive/Info.plist
          find build/LolRemote.xcarchive/Products -maxdepth 5 | head -n 40
          # Attendu : ApplicationProperties (= archive d'app) et la montre dans Watch/.
          plutil -extract ApplicationProperties.ApplicationPath raw build/LolRemote.xcarchive/Info.plist
          test -d build/LolRemote.xcarchive/Products/Applications/LolRemote.app/Watch/LolRemote.app
